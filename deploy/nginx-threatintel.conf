# nginx reverse proxy for the Threat Intelligence app.
#
#   sudo cp deploy/nginx-threatintel.conf /etc/nginx/sites-available/threatintel
#   sudo ln -s /etc/nginx/sites-available/threatintel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# It fronts BOTH backend processes on one hostname, which is why a single
# TI_PUBLIC_BASE_URL works for email links and for the dashboard:
#   /approve/… /reject/… /validate_…  → callback server, port 5000
#   everything else                   → dashboard,        port 5001
#
# Set TI_TRUSTED_PROXY_HOPS=1 so the app reads the real client IP from
# X-Forwarded-For instead of seeing every request as coming from 127.0.0.1.

upstream threatintel_dashboard {
    server 127.0.0.1:5001;
    keepalive 16;
}

upstream threatintel_callback {
    server 127.0.0.1:5000;
    keepalive 8;
}

# Redirect plain HTTP to HTTPS. Approval links and Firebase ID tokens must not
# travel in cleartext, even on an internal network.
server {
    listen 80;
    listen [::]:80;
    server_name threatintel.internal.example.com;

    # Allow ACME renewal to stay on HTTP if you use certbot.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name threatintel.internal.example.com;

    # ── TLS ──────────────────────────────────────────────────────────────
    # Replace with your certificate. For an internal-only host this can be
    # issued by the company CA; certbot works if the name resolves publicly.
    ssl_certificate     /etc/ssl/certs/threatintel.crt;
    ssl_certificate_key /etc/ssl/private/threatintel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Report attachments are small; this mostly guards against junk uploads.
    client_max_body_size 16m;

    access_log /var/log/nginx/threatintel-access.log;
    error_log  /var/log/nginx/threatintel-error.log;

    # ── Blocked: internal-only endpoints ─────────────────────────────────
    # The dashboard's /api/notify_* routes are for our own local processes.
    # They also require a signed X-Internal-Token, so this is defence in depth
    # rather than the only control — but there is no reason to expose them.
    location ^~ /api/notify_ {
        deny all;
        return 403;
    }

    # ── Callback server: the email button targets ────────────────────────
    location ~ ^/(approve|reject|validate_approve|validate_approve_process|validate_reject|validate_reject_form|validate_reject_with_remarks)/ {
        proxy_pass http://threatintel_callback;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }

    # ── Dashboard: Socket.IO ─────────────────────────────────────────────
    # Needs the upgrade headers and a long read timeout, or the live status
    # updates silently fall back to slow polling.
    location /socket.io/ {
        proxy_pass http://threatintel_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── Dashboard: everything else ───────────────────────────────────────
    location / {
        proxy_pass http://threatintel_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;   # a manual scrape can take a while
    }
}
