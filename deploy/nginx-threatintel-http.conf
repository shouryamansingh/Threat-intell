# ⚠️  TEMPORARY — plain HTTP, no TLS. Bring-up only.
#
# For the window between "the server works" and "DNS and a certificate exist".
# It routes exactly like nginx-threatintel.conf but listens on port 80 with no
# certificate, so the app can be reached by IP before a hostname is issued.
#
#   sudo cp deploy/nginx-threatintel-http.conf /etc/nginx/sites-available/threatintel
#   sudo ln -sf /etc/nginx/sites-available/threatintel /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Use it ONLY with TI_ENV=development. Under TI_ENV=production the app refuses
# to start against a plain-http TI_PUBLIC_BASE_URL, and its session cookies are
# secure-only — so a production app behind this config would let nobody log in.
#
# ── Replacing it once you have a hostname and a certificate ──────────────────
#   1. Point DNS at this server and issue a certificate
#   2. sudo cp deploy/nginx-threatintel.conf /etc/nginx/sites-available/threatintel
#   3. Edit server_name and the ssl_certificate paths in that file
#   4. In /etc/threatintel/threatintel.env set:
#          TI_ENV=production
#          TI_PUBLIC_BASE_URL=https://<your-hostname>
#   5. sudo nginx -t && sudo systemctl reload nginx
#      sudo systemctl restart threatintel-dashboard threatintel-callback
#   6. Add the hostname to Firebase → Authentication → Authorized domains
#
# While this file is live, restrict ports 80/443 to your own IP in the Lightsail
# firewall. Session cookies and Firebase ID tokens cross the network in
# cleartext under it, so it should not be reachable by anyone else.

upstream threatintel_dashboard {
    server 127.0.0.1:5001;
    keepalive 16;
}

upstream threatintel_callback {
    server 127.0.0.1:5000;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # No hostname yet — match whatever Host arrives, including a bare IP.
    server_name _;

    # No Strict-Transport-Security here: it would pin this browser to HTTPS for
    # a year against a host that cannot yet serve it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 16m;

    access_log /var/log/nginx/threatintel-access.log;
    error_log  /var/log/nginx/threatintel-error.log;

    # Internal-only endpoints. They also require a signed X-Internal-Token, so
    # this is defence in depth rather than the only control.
    location ^~ /api/notify_ {
        deny all;
        return 403;
    }

    # Callback server: the Approve / Reject targets from email.
    location ~ ^/(approve|reject|validate_approve|validate_approve_process|validate_reject|validate_reject_form|validate_reject_with_remarks)/ {
        proxy_pass http://threatintel_callback;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }

    # Dashboard: Socket.IO. Needs the upgrade headers and a long read timeout,
    # or the live activity log silently degrades to slow polling.
    location /socket.io/ {
        proxy_pass http://threatintel_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Dashboard: everything else.
    location / {
        proxy_pass http://threatintel_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;   # a manual scrape can take a while
    }
}
