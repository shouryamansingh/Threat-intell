<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · {{ brand.name }}</title>
<link rel="icon" type="image/svg+xml" href="{{ brand.icon }}">
<style>
  /* ── Quiet utility ───────────────────────────────────────────────
     Three people sign in here once a week. A door you walk through
     every Monday should not have ceremony on it, so: no card, no
     shadow, no gradient. The form sits on the page directly.

     One typeface at three sizes. The accent appears exactly twice —
     the focused field's underline and the submit button — so it means
     "this is where you are" rather than decorating.

     Brand marks come from TI_BRAND_* (see .env.example). They are
     deliberately not in this file: the repository does not carry the
     employer's visual identity, and check_secrets.py enforces that.
     Unset, the neutral shield below is used instead.                */
  :root {
    --ink:    #191C20;
    --muted:  #767D86;
    --line:   #E6E8EC;
    --accent: {{ brand.color or '#35506E' }};
    --bg:     #FFFFFF;
    --hover:  #F6F7F9;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 26px;
  }

  main { width: 100%; max-width: 300px; }

  /* Masthead ---------------------------------------------------- */
  .mk { display: flex; align-items: center; gap: 8px; margin-bottom: 44px; }
  .mk img { height: 17px; width: auto; display: block; }
  .mk svg { width: 15px; height: 15px; flex: none; display: block; }
  .mk .strap {
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }

  h1 { font-size: 20px; font-weight: 620; letter-spacing: -.018em; margin: 0 0 3px; }
  .subtitle { font-size: 13.5px; color: var(--muted); margin: 0 0 30px; }

  /* Messages ---------------------------------------------------- */
  .alert {
    display: none; font-size: 13px; line-height: 1.45;
    padding: 9px 11px; border-radius: 6px; margin-bottom: 16px;
  }
  .alert.show { display: block; }
  .alert.err  { background: #FDF1F0; color: #8C2F22; border: 1px solid #F3D6D2; }
  .alert.info { background: #F1F4F8; color: #35506E; border: 1px solid #DBE2EB; }

  /* Google ------------------------------------------------------ */
  .btn-google {
    width: 100%; height: 42px; cursor: pointer;
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    font: inherit; font-size: 14px; font-weight: 520;
    transition: background .15s, border-color .15s;
  }
  .btn-google:hover { background: var(--hover); border-color: #D6DAE0; }
  .btn-google:disabled { opacity: .55; cursor: default; }

  .divider { text-align: center; font-size: 11.5px; color: var(--muted); margin: 18px 0; }

  /* Fields: underline, not box — less ink for the same function --- */
  .field { margin-bottom: 18px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  input {
    width: 100%; height: 40px; padding: 0; font: inherit; font-size: 15px;
    color: var(--ink); background: transparent;
    border: none; border-bottom: 1px solid var(--line); border-radius: 0;
    transition: border-color .15s;
  }
  input::placeholder { color: #B4BAC2; }
  input:focus { outline: none; border-bottom-color: var(--accent); }
  input:-webkit-autofill { -webkit-text-fill-color: var(--ink); transition: background-color 9999s; }

  /* Submit ------------------------------------------------------ */
  .btn-primary-cta {
    width: 100%; height: 42px; margin-top: 8px; cursor: pointer;
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    font: inherit; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: filter .15s;
  }
  .btn-primary-cta:hover { filter: brightness(1.12); }
  .btn-primary-cta:disabled { opacity: .6; cursor: default; }

  .spinner { display: none; width: 13px; height: 13px; flex: none;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
    border-radius: 50%; animation: spin .6s linear infinite; }
  .loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* The footnote gets its own air — on the old page it touched the
     button and read as a caption for it. */
  .footnote { margin-top: 26px; font-size: 11px; color: var(--muted); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <main role="main">
    <div class="mk">
      {% if brand.logo %}
      <img src="{{ brand.logo }}" alt="{{ brand.name }}">
      {% else %}
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2 4 5.5v6c0 5 3.4 9.2 8 10.5 4.6-1.3 8-5.5 8-10.5v-6L12 2Z"
              stroke="{{ brand.color or '#35506E' }}" stroke-width="1.9" stroke-linejoin="round"/>
      </svg>
      {% endif %}
      <span class="strap">IT Internal Audit</span>
    </div>

    <h1>Weekly Cyber Watch</h1>
    <p class="subtitle">Sign in to continue.</p>

    <div class="alert err"  id="err"></div>
    <div class="alert info" id="info"></div>

    <button id="google-btn" class="btn-google" type="button">
      <svg width="16" height="16" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.26c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <div class="divider">or</div>

    <form id="email-form" autocomplete="on" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button type="submit" id="email-btn" class="btn-primary-cta">
        <span class="spinner"></span>
        <span class="btn-label">Sign in</span>
      </button>
    </form>

    <div class="footnote">Internal use only</div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    // Supplied by the server from TI_FIREBASE_* (see .env.example). Previously
    // hardcoded here, which put the Firebase project identifiers into a
    // committed file and duplicated them across three templates.
    const firebaseConfig = {{ firebase_config | tojson }};
    const firebaseConfigured = {{ 'true' if firebase_configured else 'false' }};

    if (!firebaseConfigured) {
      // Fail with an explanation rather than a bare TypeError from
      // initializeApp({}) that leaves the page looking merely broken.
      document.addEventListener('DOMContentLoaded', () => {
        const el = document.getElementById('err');
        if (el) {
          el.textContent = 'Sign-in is not configured on this server. '
            + 'Set TI_FIREBASE_API_KEY and TI_FIREBASE_PROJECT_ID in the .env file.';
          el.classList.add('show');
        }
      });
      throw new Error('Firebase is not configured — see .env.example');
    }

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.useDeviceLanguage();

    const errEl  = document.getElementById('err');
    const infoEl = document.getElementById('info');
    const emailBtn = document.getElementById('email-btn');
    const showErr  = (msg) => { errEl.textContent  = msg; errEl.classList.add('show');  infoEl.classList.remove('show'); };
    const showInfo = (msg) => { infoEl.textContent = msg; infoEl.classList.add('show'); errEl.classList.remove('show');  };
    const clearMsg = () => { errEl.classList.remove('show'); infoEl.classList.remove('show'); };

    function nextUrl() {
      const params = new URLSearchParams(window.location.search);
      const next = params.get('next');
      if (next && next.startsWith('/')) return next;
      return '/';
    }

    async function exchangeForSession(user) {
      const idToken = await user.getIdToken(/*forceRefresh*/ true);
      const resp = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken })
      });
      const j = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        // The server files an access request for a verified identity that isn't
        // allow-listed yet, so this is a waiting room, not a failure.
        if (j.error === 'access_request') {
          // Drop the client-side Firebase session — they are not signed in here.
          try { await auth.signOut(); } catch (e) {}
          showInfo(j.message || 'Your access request has been sent to the administrators.');
          return;
        }
        if (j.error === 'account_disabled') {
          try { await auth.signOut(); } catch (e) {}
          showErr(j.message || 'Your account is disabled.');
          return;
        }
        throw new Error(j.message || j.error || `Server rejected sign-in (${resp.status})`);
      }
      if (j.needs_setup) {
        window.location.href = '/setup-profile';
        return;
      }
      window.location.href = nextUrl();
    }

    /** Try a local (admin-created) email+password account first.
     *  Returns 'ok' | 'unknown' | 'handled' — 'unknown' means fall through to
     *  Firebase, which owns the organization's SSO identities. */
    async function tryLocalLogin(email, password) {
      let resp, j = {};
      try {
        resp = await fetch('/api/auth/local-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        j = await resp.json().catch(() => ({}));
      } catch (e) {
        return 'unknown';           // network hiccup — let Firebase have a go
      }
      if (resp.ok) {
        window.location.href = nextUrl();
        return 'ok';
      }
      if (j.error === 'account_disabled') {
        showErr(j.message || 'Your account is disabled.');
        return 'handled';
      }
      // Locked out by the server-side throttle. Terminal on purpose: falling
      // through to the Firebase attempt would overwrite this with a misleading
      // "no such user" and hide the real reason they can't get in.
      if (resp.status === 429 || j.error === 'too_many_attempts') {
        showErr(j.message || 'Too many failed attempts. Try again later.');
        return 'handled';
      }
      // No local account with that address at all → it may be a Firebase one.
      if (j.unknown_account) return 'unknown';
      // A local account exists but the password was wrong: say so rather than
      // letting Firebase report a confusing "no such user".
      showErr(j.message || 'Email or password is incorrect.');
      return 'handled';
    }

    document.getElementById('google-btn').addEventListener('click', async () => {
      clearMsg();
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      try {
        const result = await auth.signInWithPopup(provider);
        await exchangeForSession(result.user);
      } catch (e) {
        if (e.code === 'auth/popup-closed-by-user') return;
        showErr(e.message || 'Google sign-in failed');
      }
    });

    document.getElementById('email-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      clearMsg();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { showErr('Email and password are required'); return; }
      emailBtn.classList.add('loading'); emailBtn.disabled = true;
      try {
        // Local accounts (created by an admin in Users & Access) live in this
        // project's database, not in Firebase — check them first, then fall back.
        const local = await tryLocalLogin(email, password);
        if (local !== 'unknown') return;

        const result = await auth.signInWithEmailAndPassword(email, password);
        await exchangeForSession(result.user);
      } catch (e) {
        const map = {
          'auth/invalid-email': 'That email looks invalid.',
          'auth/user-disabled': 'This account is disabled.',
          'auth/user-not-found': 'No password set for that email. Sign in with Google first — you can set a password from My Account once an administrator approves you.',
          'auth/wrong-password': 'Wrong password.',
          'auth/invalid-credential': 'Email or password is incorrect.',
          'auth/too-many-requests': 'Too many attempts. Try again in a few minutes.',
        };
        showErr(map[e.code] || e.message || 'Sign-in failed');
      } finally {
        emailBtn.classList.remove('loading'); emailBtn.disabled = false;
      }
    });

  </script>
</body>
</html>
